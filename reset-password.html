<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set new password</title>
  <link rel="stylesheet" href="index.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div style="max-width:380px;margin:80px auto;padding:24px;font-family:sans-serif">
    <h2>Set a new password</h2>
    <form id="form" style="display:none">
      <input type="password" id="pw" placeholder="New password" minlength="6" required
             style="width:100%;padding:10px;margin:12px 0">
      <button type="submit" style="width:100%;padding:10px">Update password</button>
    </form>
    <p id="msg">Checking your reset link...</p>
  </div>

  <script>
    const sb = supabase.createClient(
      'https://pfgwavzauqqbrcmgqjou.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmZ3dhdnphdXFxYnJjbWdxam91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3MDM5MTIsImV4cCI6MjEwOTI3OTkxMn0.qGqJd6DwjqBx8UNK846oLz0dA-8xgA_L6bjbkml5lVQ'
    );
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');

    function showForm() {
      form.style.display = 'block';
      msg.textContent = '';
    }

    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') showForm();
    });

    // Fallback in case the recovery event fired before the listener was ready
    sb.auth.getSession().then(({ data }) => {
      if (data.session && location.hash.includes('type=recovery')) showForm();
    });

    setTimeout(() => {
      if (form.style.display === 'none') {
        msg.textContent = 'This link is invalid or expired. Request a new reset email.';
      }
    }, 4000);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.updateUser({
        password: document.getElementById('pw').value
      });
      msg.textContent = error ? error.message : 'Password updated! Redirecting...';
      if (!error) setTimeout(() => location.href = 'index.html', 1500);
    });
  </script>
</body>
</html>
